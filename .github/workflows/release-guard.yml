name: Release Guard

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  sparkle-update-check:
    name: Sparkle update package check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public Sparkle update ZIP
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Sparkle update verification attempt $attempt..."
            if swift scripts/verify_appcast_update.swift --public-release-notes; then
              exit 0
            fi
            sleep 20
          done

          echo "The public GitHub release ZIP does not match appcast.xml."
          echo "Regenerate appcast.xml from the exact uploaded ZIP before announcing the release."
          exit 1
