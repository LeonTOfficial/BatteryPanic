name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos-checks:
    name: macOS checks
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run logic tests
        run: ./scripts/run_tests.sh

      - name: Build Swift package
        run: swift build

      - name: Build local app and release packages
        run: ./scripts/build_app.sh

      - name: Verify release package signatures
        run: |
          rm -rf /tmp/BatteryPanicZipCheck
          mkdir -p /tmp/BatteryPanicZipCheck
          release_zip="$(ls outputs/Battery.Panic.*.zip | head -n 1)"
          release_dmg="$(ls outputs/Battery.Panic.*.dmg | head -n 1)"
          echo "Checking $release_zip"
          echo "Checking $release_dmg"
          ditto -x -k "$release_zip" /tmp/BatteryPanicZipCheck
          test -d "/tmp/BatteryPanicZipCheck/Battery Panic.app/Contents/PlugIns/BatteryPanicWidgetExtension.appex"
          test -d "/tmp/BatteryPanicZipCheck/Battery Panic.app/Contents/Frameworks/Sparkle.framework"
          codesign --verify --deep --strict --verbose=2 "/tmp/BatteryPanicZipCheck/Battery Panic.app"
          test -f "$release_dmg"

      - name: Scan for committed secret-looking values
        run: |
          if rg -n "(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY|api[_-]?key\s*=|password\s*=|secret\s*=)" . --glob '!/.build/**' --glob '!outputs/**'; then
            echo "Secret-looking value found. Please review before publishing."
            exit 1
          fi
