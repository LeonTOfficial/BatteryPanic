name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-checks:
    name: macOS checks
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Setup website Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build website source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --dir website --frozen-lockfile --ignore-scripts
          cd website
          pnpm run lint
          pnpm run build

      - name: Check website links and built pages
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/download/index.html
          test -f docs/updates/index.html
          test -f docs/release-notes/0.7.0/index.html
          test -f docs/release-notes/0.6.0/index.html
          test -f docs/release-notes/0.5.16/index.html
          test -f docs/release-notes/0.5.15/index.html
          test -f docs/sparkle-release-notes/0.7.0/index.html
          test -f docs/sparkle-release-notes/0.6.0/index.html
          test -f docs/sparkle-release-notes/0.5.16/index.html
          test -f docs/sparkle-release-notes/0.5.15/index.html
          test -f docs/sparkle-release-notes/0.5.14/index.html
          test -f docs/sparkle-release-notes/0.5.13/index.html
          test -f docs/sparkle-release-notes/0.5.11/index.html
          test -f docs/sparkle-release-notes/0.5.9/index.html
          test -f docs/sparkle-release-notes/history.css
          test -d docs/web-assets
          grep -q "/BatteryPanic/web-assets/" docs/index.html
          grep -q "/BatteryPanic/web-assets/" docs/download/index.html
          grep -q "/BatteryPanic/web-assets/" docs/updates/index.html
          grep -q "/BatteryPanic/web-assets/" docs/release-notes/0.7.0/index.html
          grep -q "/BatteryPanic/web-assets/" docs/release-notes/0.6.0/index.html
          grep -q "/BatteryPanic/web-assets/" docs/release-notes/0.5.16/index.html
          grep -q "What gets checked" docs/web-assets/*.js
          grep -q "Release notes remain available on this page" docs/web-assets/*.js
          grep -q "Download DMG" docs/web-assets/*.js
          grep -q "Free and open source" docs/web-assets/*.js
          grep -qi "battery dashboard" docs/web-assets/*.js
          grep -qi "recording pauses" docs/web-assets/*.js
          grep -q "Follow every public update" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.7.0/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.6.0/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.5.16/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.5.15/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.5.14/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.5.11/" docs/web-assets/*.js
          grep -q "sparkle-release-notes/0.5.9/" docs/web-assets/*.js

      - name: Run logic tests
        run: ./scripts/run_tests.sh

      - name: Run native Swift tests
        run: swift test

      - name: Check version contract
        run: ./scripts/check_version_consistency.sh

      - name: Build Swift package
        run: swift build

      - name: Build Xcode project
        run: xcodebuild -project "Battery Panic/Battery Panic.xcodeproj" -scheme "Battery Panic" -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build local app and release packages
        run: ./scripts/build_app.sh

      - name: Verify release packages and metadata
        run: |
          set -euo pipefail
          rm -rf /tmp/BatteryPanicZipCheck
          mkdir -p /tmp/BatteryPanicZipCheck
          release_zip="outputs/Battery.Panic.0.7.0.zip"
          release_dmg="outputs/Battery.Panic.0.7.0.dmg"
          echo "Checking $release_zip"
          echo "Checking $release_dmg"

          ditto -x -k "$release_zip" /tmp/BatteryPanicZipCheck
          app="/tmp/BatteryPanicZipCheck/Battery Panic.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/Battery Panic"
          test -z "$(find "$app" -name '*.appex' -print -quit)"
          ! codesign -d --entitlements :- "$app" 2>&1 | grep -q "application-groups"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$app/Contents/Resources/Sparkle-LICENSE.txt"

          app_version="$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)"
          app_build="$(defaults read "$app/Contents/Info.plist" CFBundleVersion)"
          test "$app_version" = "0.7.0"
          test "$app_build" = "23"

          test "$(defaults read "$app/Contents/Info.plist" SUEnableAutomaticChecks)" = "1"
          test "$(defaults read "$app/Contents/Info.plist" SUAutomaticallyUpdate)" = "1"
          test "$(defaults read "$app/Contents/Info.plist" SUEnableSystemProfiling)" = "0"
          test "$(defaults read "$app/Contents/Info.plist" SUScheduledCheckInterval)" = "86400"
          test "$(defaults read "$app/Contents/Info.plist" SUScheduledImpatientCheckInterval)" = "172800"
          sparkle_version="$(defaults read "$app/Contents/Frameworks/Sparkle.framework/Resources/Info.plist" CFBundleShortVersionString)"
          test "$sparkle_version" = "2.9.5"

          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$release_dmg"
          test -s "$release_zip"
          test -s "$release_dmg"

          xmllint --noout appcast.xml
          grep -q "<sparkle:shortVersionString>0.7.0</sparkle:shortVersionString>" appcast.xml
          grep -q "<sparkle:version>23</sparkle:version>" appcast.xml
          grep -q "leontofficial.github.io/BatteryPanic/sparkle-release-notes/0.7.0/" appcast.xml
          grep -q "leontofficial.github.io/BatteryPanic/sparkle-release-notes/0.6.0/" appcast.xml
          grep -q "leontofficial.github.io/BatteryPanic/sparkle-release-notes/0.5.16/" appcast.xml
          grep -q "leontofficial.github.io/BatteryPanic/sparkle-release-notes/0.5.15/" appcast.xml
          grep -q "releases/download/v0.7.0/Battery.Panic.0.7.0.zip" appcast.xml
          # CI rebuilds have different archive bytes and cannot match the signed
          # release ZIP. Release Guard verifies the uploaded ZIP cryptographically.
          swift scripts/verify_appcast_update.swift --metadata-only

      - name: Check repository release docs
        run: |
          set -euo pipefail
          test -f CODE_OF_CONDUCT.md
          test -f .github/dependabot.yml
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/feature_request.yml
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/workflows/release-guard.yml
          test -f .github/agents/release-manager.agent.md
          test -f .github/agents/website-polisher.agent.md
          test -f .github/agents/security-quality-reviewer.agent.md
          test -x scripts/run_icon_tests.sh
          test -f Tests/BatteryPanicTests/MenuBarIconTestRunner.swift
          test -f Battery.Panic.0.7.0.md
          test -f Battery.Panic.0.6.0.md
          test -f Battery.Panic.0.5.16.md
          test -f docs/index.html
          test -f docs/download/index.html
          test -f docs/updates/index.html
          test -f docs/release-notes/0.7.0/index.html
          test -f docs/release-notes/0.6.0/index.html
          test -f docs/release-notes/0.5.16/index.html
          test -f docs/release-notes/0.5.15/index.html
          test -f docs/sparkle-release-notes/0.7.0/index.html
          test -f docs/sparkle-release-notes/0.6.0/index.html
          test -f docs/sparkle-release-notes/0.5.16/index.html
          test -f docs/sparkle-release-notes/0.5.15/index.html
          test -f docs/sparkle-release-notes/0.5.14/index.html
          test -f docs/sparkle-release-notes/0.5.13/index.html
          test -f docs/sparkle-release-notes/0.5.11/index.html
          test -f docs/sparkle-release-notes/0.5.9/index.html
          test -f docs/sparkle-release-notes/history.css
          test -f docs/.nojekyll
          test -d docs/web-assets
          test -f docs/wiki/Home.md
          test -f docs/wiki/Installation.md
          test -f docs/wiki/Updates.md
          grep -q "Battery Panic 0.7.0 Release Notes" Battery.Panic.0.7.0.md
          grep -qi "update" Battery.Panic.0.7.0.md
          grep -qi "recording pauses" Battery.Panic.0.7.0.md
          grep -q "Battery Panic 0.6.0 Release Notes" Battery.Panic.0.6.0.md
          grep -qi "battery dashboard" Battery.Panic.0.6.0.md
          grep -qi "battery history" Battery.Panic.0.6.0.md
          grep -q "Battery Panic 0.5.16 Release Notes" Battery.Panic.0.5.16.md
          grep -q "stable, separate vertical baselines" Battery.Panic.0.5.16.md
          grep -q "pixel-band checks" Battery.Panic.0.5.16.md
          grep -q "Battery Panic · 0.7.0" docs/sparkle-release-notes/0.7.0/index.html
          grep -q "What’s new in this update" docs/sparkle-release-notes/0.7.0/index.html
          grep -q "Scroll down to see all changes" docs/sparkle-release-notes/0.7.0/index.html
          grep -q "Battery Panic 0.6.0" docs/sparkle-release-notes/0.6.0/index.html
          grep -q "Release highlights" docs/sparkle-release-notes/0.6.0/index.html
          grep -q "Update history" docs/sparkle-release-notes/0.6.0/index.html
          grep -q "Battery Panic 0.5.16" docs/sparkle-release-notes/0.5.16/index.html
          grep -q "What&apos;s new in this update" docs/sparkle-release-notes/0.5.16/index.html
          grep -q "Update history" docs/sparkle-release-notes/0.5.16/index.html
          grep -q "Battery Panic 0.5.15" docs/sparkle-release-notes/0.5.15/index.html
          grep -q "What&apos;s new in this update" docs/sparkle-release-notes/0.5.15/index.html
          grep -q "Update history" docs/sparkle-release-notes/0.5.15/index.html
          grep -q "Battery Panic 0.5.14" docs/sparkle-release-notes/0.5.14/index.html
          grep -q "What&apos;s new in this update" docs/sparkle-release-notes/0.5.14/index.html
          grep -q "Update history" docs/sparkle-release-notes/0.5.14/index.html
          grep -q "Battery Panic 0.5.11" docs/sparkle-release-notes/0.5.11/index.html
          grep -q "Battery Panic 0.5.9" docs/sparkle-release-notes/0.5.9/index.html
          grep -q "Battery.Panic.0.7.0.dmg" README.md
          grep -q "Battery.Panic.0.7.0.zip" README.md
          grep -q "Battery Panic - macOS Battery Alerts" docs/index.html
          grep -q "Download Battery Panic" docs/download/index.html
          grep -q "Battery Panic Updates" docs/updates/index.html
          grep -q "Battery Panic 0.7.0 Release Notes" docs/release-notes/0.7.0/index.html
          grep -q "Battery Panic 0.6.0 Release Notes" docs/release-notes/0.6.0/index.html
          grep -q "Battery Panic 0.5.16 Release Notes" docs/release-notes/0.5.16/index.html
          grep -q "/BatteryPanic/web-assets/" docs/index.html
          grep -q "Never Ignore" docs/web-assets/*.js
          grep -q "Free and open source" docs/web-assets/*.js
          grep -q "Download DMG" docs/web-assets/*.js
          grep -q "releases/download/v0.7.0/Battery.Panic.0.7.0.dmg" docs/web-assets/*.js
          grep -q "Developed by LeonTOfficial" docs/web-assets/*.js
          grep -q "discord.gg/JPjrw3ft" docs/web-assets/*.js
          grep -q "battery-panic-icon.png" docs/web-assets/*.js
          grep -qi "battery dashboard" docs/web-assets/*.js
          grep -qi "recording pauses" docs/web-assets/*.js
          grep -q "Follow every public update" docs/web-assets/*.js
          grep -q "discord.gg/JPjrw3ft" README.md
          test -f docs/RELEASE_0.7.0_TEXT.md
          test -f docs/RELEASE_0.6.0_TEXT.md
          test -f docs/RELEASE_0.5.16_TEXT.md
          test -f docs/assets/battery-panic-icon.png

      - name: Scan for committed secret-looking values
        run: |
          set -euo pipefail
          if rg -n "(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY|api[_-]?key\s*=|password\s*=|secret\s*=)" . --glob '!/.build/**' --glob '!outputs/**'; then
            echo "Secret-looking value found. Please review before publishing."
            exit 1
          fi
