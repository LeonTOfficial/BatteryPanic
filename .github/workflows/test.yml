name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos-checks:
    name: macOS checks
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Setup website Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --dir website --frozen-lockfile --ignore-scripts
          cd website
          pnpm run lint
          pnpm run build

      - name: Check website links and built pages
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/download/index.html
          test -f docs/updates/index.html
          test -f docs/release-notes/0.5.11/index.html
          test -d docs/web-assets
          grep -q "/BatteryPanic/web-assets/" docs/index.html
          grep -q "/BatteryPanic/web-assets/" docs/download/index.html
          grep -q "/BatteryPanic/web-assets/" docs/updates/index.html
          grep -q "/BatteryPanic/web-assets/" docs/release-notes/0.5.11/index.html
          site_bundle="$(ls docs/web-assets/*.js | sort | tail -n 1)"
          grep -q "What gets checked" "$site_bundle"
          grep -q "Release notes remain available on this page" "$site_bundle"
          grep -q "Download DMG" "$site_bundle"
          grep -q "Free and open source" "$site_bundle"
          grep -q "Thank you to Anni3" "$site_bundle"

      - name: Run logic tests
        run: ./scripts/run_tests.sh

      - name: Build Swift package
        run: swift build

      - name: Build Xcode project
        run: xcodebuild -project "Battery Panic/Battery Panic.xcodeproj" -scheme "Battery Panic" -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build local app and release packages
        run: ./scripts/build_app.sh

      - name: Verify release packages and metadata
        run: |
          set -euo pipefail
          rm -rf /tmp/BatteryPanicZipCheck
          mkdir -p /tmp/BatteryPanicZipCheck
          release_zip="$(ls outputs/Battery.Panic.*.zip | sort | tail -n 1)"
          release_dmg="$(ls outputs/Battery.Panic.*.dmg | sort | tail -n 1)"
          echo "Checking $release_zip"
          echo "Checking $release_dmg"

          ditto -x -k "$release_zip" /tmp/BatteryPanicZipCheck
          app="/tmp/BatteryPanicZipCheck/Battery Panic.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/Battery Panic"
          test -d "$app/Contents/PlugIns/BatteryPanicWidgetExtension.appex"
          test -d "$app/Contents/Frameworks/Sparkle.framework"

          app_version="$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)"
          app_build="$(defaults read "$app/Contents/Info.plist" CFBundleVersion)"
          test "$app_version" = "0.5.11"
          test "$app_build" = "16"

          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$release_dmg"
          test -s "$release_zip"
          test -s "$release_dmg"

          xmllint --noout appcast.xml
          grep -q "<sparkle:shortVersionString>0.5.11</sparkle:shortVersionString>" appcast.xml
          grep -q "<sparkle:version>16</sparkle:version>" appcast.xml
          grep -q "leontofficial.github.io/BatteryPanic/release-notes/0.5.11/" appcast.xml
          grep -q "releases/download/v0.5.11/Battery.Panic.0.5.11.zip" appcast.xml
          swift scripts/verify_appcast_update.swift

      - name: Check repository release docs
        run: |
          set -euo pipefail
          test -f Battery.Panic.0.5.11.md
          test -f docs/index.html
          test -f docs/download/index.html
          test -f docs/updates/index.html
          test -f docs/release-notes/0.5.11/index.html
          test -f docs/.nojekyll
          test -d docs/web-assets
          grep -q "Battery Panic 0.5.11 Release Notes" Battery.Panic.0.5.11.md
          grep -q "Battery Panic Siren keeps its original one-shot" Battery.Panic.0.5.11.md
          grep -q "Thank you to Anni3" Battery.Panic.0.5.11.md
          grep -q "Battery.Panic.0.5.11.dmg" README.md
          grep -q "Battery.Panic.0.5.11.zip" README.md
          grep -q "Battery Panic - macOS Battery Alerts" docs/index.html
          grep -q "Download Battery Panic" docs/download/index.html
          grep -q "Battery Panic Updates" docs/updates/index.html
          grep -q "Battery Panic 0.5.11 Release Notes" docs/release-notes/0.5.11/index.html
          grep -q "/BatteryPanic/web-assets/" docs/index.html
          site_bundle="$(ls docs/web-assets/*.js | sort | tail -n 1)"
          grep -q "Never Ignore" "$site_bundle"
          grep -q "Free and open source" "$site_bundle"
          grep -q "Download DMG" "$site_bundle"
          grep -q "releases/download/v0.5.11/Battery.Panic.0.5.11.dmg" "$site_bundle"
          grep -q "Developed by LeonTOfficial" "$site_bundle"
          grep -q "discord.gg/JPjrw3ft" "$site_bundle"
          grep -q "battery-panic-icon.png" "$site_bundle"
          grep -q "Charging reminders and stronger critical alerts" "$site_bundle"
          grep -q "Battery Panic Siren keeps its original one-shot" "$site_bundle"
          grep -q "Thank you to Anni3" "$site_bundle"
          grep -q "discord.gg/JPjrw3ft" README.md
          test -f docs/RELEASE_0.5.11_TEXT.md
          test -f docs/assets/battery-panic-icon.png

      - name: Scan for committed secret-looking values
        run: |
          set -euo pipefail
          if rg -n "(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY|api[_-]?key\s*=|password\s*=|secret\s*=)" . --glob '!/.build/**' --glob '!outputs/**'; then
            echo "Secret-looking value found. Please review before publishing."
            exit 1
          fi
