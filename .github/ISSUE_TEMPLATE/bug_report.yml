name: Bug report
description: Report a problem with Battery Panic.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail so the issue can be reproduced.
  - type: input
    id: version
    attributes:
      label: Battery Panic version
      description: You can find this in the app menu or release filename.
      placeholder: "0.5.11"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.x"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "The app..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Battery Panic
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "I expected..."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Drag files here if they help explain the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include passwords, tokens, private keys, or other sensitive data.
          required: true
